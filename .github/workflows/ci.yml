name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run the whole suite against multiple Python versions in parallel.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

  # Validate the infrastructure-as-code on every change, the same way the
  # Python is validated. No cloud credentials needed — fmt/init/validate are
  # hermetic checks that catch broken IaC before it reaches a regression run.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize (no backend)
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate
